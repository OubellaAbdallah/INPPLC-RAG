<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="INPPLC Assistant — AI-powered information specialist for anti-corruption and probity in Morocco." />
  <title>INPPLC — Assistant IA</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">

    <!-- ── Top: toggle button (always visible) ── -->
    <div class="sidebar-top">
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Close sidebar">
        <!-- Hamburger: shown when collapsed -->
        <span class="toggle-icon toggle-icon--menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </span>
        <!-- X: shown when open -->
        <span class="toggle-icon toggle-icon--close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </span>
      </button>
    </div>

    <!-- ── Middle: action buttons + sessions (hidden when collapsed) ── -->
    <div class="sidebar-content">
      <div class="sidebar-actions">
        <button class="sidebar-btn sidebar-btn--primary" id="newChatBtn">
          <span class="sidebar-btn__icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </span>
          New Chat
        </button>

        <button class="sidebar-btn sidebar-btn--secondary" id="recentChatsBtn">
          <span class="sidebar-btn__icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
          </span>
          Recent Chats
        </button>
      </div>

      <!-- Sessions list -->
      <div class="sidebar-sessions" id="sessionsList">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- ── Bottom: search (full bar when open, icon-only when collapsed) ── -->
    <div class="sidebar-search-wrapper">
      <div class="sidebar-search">
        <svg class="sidebar-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="sidebarSearch" placeholder="Search chat" aria-label="Search chats" />
      </div>
    </div>

  </aside>

  <!-- ===== MAIN AREA ===== -->
  <div class="main-wrapper" id="mainWrapper">

    <!-- Top bar -->
    <header class="topbar" id="topbar">
      <div class="topbar__right">
        <button class="topbar__icon-btn" id="warningBtn" title="Report an issue" aria-label="Report issue">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
            <line x1="12" y1="9" x2="12" y2="13" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="17" r="1" fill="#1a1a1a"/>
          </svg>
        </button>

        <button class="topbar__icon-btn" id="clearChatBtn" title="Clear conversation" aria-label="Clear conversation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>

        <div class="topbar__search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="topbarSearch" placeholder="Search" aria-label="Search messages" />
        </div>
      </div>
    </header>

    <!-- Main Container (Chat + Audit Trail) -->
    <div class="chat-main-container">

      <!-- Chat Section (Messages + Input) -->
      <div class="chat-section">
        <!-- Chat area -->
        <main class="chat-area" id="chatArea">

          <!-- Welcome / logo state -->
          <div class="chat-welcome" id="chatWelcome">
            <img
              src="assets/logo.png"
              alt="INPPLC Logo"
              class="welcome-logo"
              id="welcomeLogo"
            />
          </div>

          <!-- Messages feed -->
          <div class="messages-feed" id="messagesFeed">
            <!-- Messages rendered by JS -->
          </div>
        </main>

        <!-- Input area -->
        <div class="input-area">
          <div class="input-box" id="inputBox">
            <textarea
              id="messageInput"
              placeholder="Type a new message here"
              rows="1"
              aria-label="Message input"
            ></textarea>
            <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <p class="input-disclaimer">INPPLC Assistant may make mistakes. Verify important information.</p>
        </div>
      </div><!-- /chat-section -->

      <!-- Audit Trail Panel -->
      <aside class="audit-trail-panel collapsed" id="auditTrailPanel">
        <div class="audit-panel-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span>Traçabilité des sources</span>
          </h3>
          <button class="audit-panel-close-btn" id="auditPanelCloseBtn" aria-label="Close audit panel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        
        <div class="audit-panel-content" id="auditPanelContent">
          <div class="audit-active-query" id="auditActiveQuery">
            Sélectionnez un message pour voir ses sources.
          </div>
          <div class="audit-sources-list" id="auditSourcesList">
            <!-- Populated by JS -->
          </div>
        </div>
      </aside>

    </div><!-- /chat-main-container -->

  </div><!-- /main-wrapper -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
