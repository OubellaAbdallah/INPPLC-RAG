[tool.poetry]
name = "inpplc-rag"
version = "1.0.0"
description = "RAG Information Assistant for INPPLC Morocco"
authors = ["Soufiane Elassri"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.scripts]
inpplc = "src.app.main:run"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# Core ML & NLP
torch = ">=2.12.0"
transformers = ">=4.57.0"
accelerate = ">=1.5.0"
sentence-transformers = ">=4.1.0"
tiktoken = ">=0.12.0"
rank-bm25 = ">=0.2.2"
scikit-learn = ">=1.8.0"

# LangChain ecosystem
langchain = ">=0.3.27"
langchain-community = ">=0.3.27"
langchain-chroma = ">=1.1.0"

# Vector store
chromadb = ">=1.5.9"

# Web framework & API
fastapi = ">=0.136.0"
uvicorn = {version = ">=0.44.0", extras = ["standard"]}
httpx = ">=0.28.1"

# Document processing
unstructured = {version = ">=0.20.0", extras = ["pdf"]}
pdfminer-six = ">=20251230"
pdf2image = ">=1.17.0"
pi-heif = ">=1.2.0"
unstructured-inference = ">=1.2.0"
unstructured-pytesseract = ">=0.3.0"
pillow = ">=12.2.0"
python-magic-bin = {version = ">=0.4.14", markers = "sys_platform == 'win32'"}
python-magic = {version = ">=0.4.27", markers = "sys_platform != 'win32'"}

# Web scraping & API requests
requests = ">=2.34.0"
mistralai = ">=2.4.8"

# Configuration & logging
pydantic = ">=2.13.0"
pydantic-settings = ">=2.14.0"
python-dotenv = ">=1.0.0"
structlog = ">=25.5.0"

# Data & visualization
numpy = ">=2.4.0"
pandas = ">=2.2.0"
plotly = ">=5.20.0"
matplotlib = ">=3.10.0"

# PDF report generation & parsing
reportlab = ">=4.4.0"

# Progress tracking
tqdm = ">=4.67.0"

# HuggingFace
hf-xet = ">=1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=1.0.0"
pytest-cov = ">=6.1.0"
ruff = ">=0.11.0"
mypy = ">=1.16.0"
ipykernel = ">=6.29.0"

[tool.poetry.group.eval.dependencies]
ragas = ">=0.4.3"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
